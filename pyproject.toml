[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "experiments",
    ".worktrees",
    "scrap",
    "scrape.py",
    "rtds_monitor.py",
    "web_monitor.py",
    "orderbook_monitor.py",
    # Python TUI: legacy rich.Layout dashboard (default launch path) and
    # the frozen Textual rewrite + its tests. Per tui/README.md the
    # Textual TUI is frozen pending the ratatui Rust replacement;
    # format-fixing frozen code produces churn for no operational
    # benefit. Revisit if the Rust path is abandoned and the Textual
    # dashboard becomes the sole TUI.
    "tui/python/dashboard_legacy.py",
    "tui/python/dashboard.py",
    "tui/tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (subset)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long — long math comments OK; keep formatter authoritative
    "E731",  # lambda assignment
    "B008",  # mutable default — used in a few legacy daemon spots
    "B904",  # raise from — noisy on existing daemon error handling
]

# E402 in test_consolidate_data.py is intentional: imports are co-located with
# the test groups that need them, after a sys.path manipulation. Don't fight it.
[tool.ruff.lint.per-file-ignores]
"tests/scripts/test_consolidate_data.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "active_bots/tests",
]
# Stop pytest from descending into experiments/ (37 stale fork copies of
# tests/) and tui/tests/ (separate test root). Those still run via their
# own root-cd'd invocations; they just don't pollute the global suite.
norecursedirs = [
    # pytest defaults that would otherwise be lost when norecursedirs is set
    # explicitly (extending the default is unsupported; we re-list them here
    # so dot-prefixed caches like .hypothesis stay ignored).
    ".*",
    "build",
    "dist",
    "CVS",
    "_darcs",
    "{arch}",
    "*.egg",
    "venv",
    # Project-specific
    "experiments",
    ".worktrees",
    "tui",
    "scrap",
    "__pycache__",
]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
