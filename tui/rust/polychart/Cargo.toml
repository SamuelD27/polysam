[package]
name = "polychart"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Rust TUI dashboard for polymarket-hustle daemon_base_v1"
publish = false

[[bin]]
name = "polychart"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
notify = "6"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "sync"] }

[dev-dependencies]
tempfile = "3"
